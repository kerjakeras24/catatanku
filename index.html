<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CatatanKu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📒 CatatanKu</h1>
        <p>Simpan catatan pribadi kamu.</p>

        <div class="form">
            <input 
                type="text" 
                id="judul" 
                placeholder="Judul catatan"
            >

            <textarea 
                id="isi" 
                placeholder="Tulis catatan kamu..."
            ></textarea>

            <button onclick="tambahCatatan()">
                ➕ Simpan Catatan
            </button>
        </div>

        <div id="daftarCatatan"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
