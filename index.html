<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CatatanKu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📒 CatatanKu</h1>
        <p>Simpan catatan pribadi kamu.</p>


        <!-- FORM CATATAN -->
        <div class="form">

            <input
                type="text"
                id="judul"
                placeholder="Judul catatan"
            >

            <textarea
                id="isi"
                placeholder="Tulis catatan kamu..."
            ></textarea>


            <!-- Tombol simpan -->
            <button
                id="tombolSimpan"
                onclick="tambahCatatan()"
            >
                ➕ Simpan Catatan
            </button>


            <!-- Tombol batal edit -->
            <button
                id="tombolBatal"
                onclick="batalEdit()"
                style="display: none;"
            >
                ❌ Batal Edit
            </button>

        </div>


        <!-- DAFTAR CATATAN -->
        <div id="daftarCatatan"></div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SCRIPT KITA -->
    <script src="script.js"></script>

</body>

</html>
